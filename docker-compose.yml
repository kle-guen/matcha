services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "7000:7000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - my_network
    volumes:
      - .env:/usr/src/app/.env

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "4200:4200"
    environment:
      - .env
    depends_on:
      - backend
    networks:
      - my_network
    volumes:
      - ./Frontend:/usr/src/app
      - /usr/src/app/node_modules

  postgres:
    image: postgres:15.8-alpine
    container_name: postgres_container
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
    driver: local

networks:
  my_network:
    name: my_network