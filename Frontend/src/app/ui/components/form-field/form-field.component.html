<mat-form-field class="flex flex-grow w-full " appearance="outline">
	<mat-label>{{ label }}</mat-label>
	@if (options.length > 0) {
		<mat-select [formControl]="control" [multiple]="multipleSelection" [compareWith]="compareInterests">
			@for (option of options; track option.code) {
				<mat-option [value]="option.code">{{ option.label }}</mat-option>
			}
		</mat-select>
	} @else if (type === 'textarea') {
		<textarea
				matInput
				rows="4"
				data-limit-rows="true"
				data-limit-rows-max="10"
				maxlength="400"
				[placeholder]="label"
				[formControl]="control"
				(input)="limitRows($event)"
		></textarea>
	} @else {
		<div class="flex justify-between">
			<input
					matInput
					[placeholder]="label"
					[formControl]="control"
					[type]="type"
					[value]="value"
					[autocomplete]="autocomplete"
			>
			@if (icon) {
				<mat-icon class="text-gray-700 cursor-pointer hover:text-gray-500"
						  (click)="sendEvent($event)">
					{{ icon }}
				</mat-icon>
			}
		</div>
	}
	@if (control.invalid) {
		<mat-error>
			<ng-content select="[errors]"/>
		</mat-error>
	}
</mat-form-field>
