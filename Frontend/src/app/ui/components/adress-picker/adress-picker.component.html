<div class="panel">
	<div>
		<span class="sb-title">Select your adress</span>
	</div>
	<input type="text" placeholder="Address" id="location-input"/>
</div>

<!-- Add a div to hold the map -->
<div id="map" style="height: 500px; width: 100%;"></div>
<div class="flex flex-col panel mt-5 p-5 text-center">
	<span>latitude : {{latitude}}</span>
	<span>longitude : {{longitude}}</span>
	<app-button label="Confirm marker position" (click)="checkout()"></app-button>
</div>
