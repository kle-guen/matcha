<mat-card appearance="outlined">
	<mat-card-header>
		<div mat-card-avatar></div>
		<mat-card-title>{{user.name + ' ' + user.age}}</mat-card-title>
		<mat-card-subtitle>{{user.nickname + ' ' + user.sexe}}</mat-card-subtitle>
	</mat-card-header>
	<img mat-card-image src="https://material.angular.io/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu">
	<mat-card-content>
		<p class="line-clamp-3">
			{{user.description}}
		</p>
	</mat-card-content>
	<mat-card-actions>
		<app-button
				label="See more"
				type="tertiary"
				(clicked)="navigateToUserPage(user)"
		/>
	</mat-card-actions>
</mat-card>
