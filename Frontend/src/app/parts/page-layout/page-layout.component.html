<div class="page-layout h-screen flex flex-col flex-grow">
	<div class="header sticky-top">
		<app-main-header
				[notificationsCount]="notificationsCount"
				[messages]="messagesCount"
				class="w-full"/>
	</div>
	<div class="flex-grow" [ngClass]="!showFooter ? 'overflow-hidden' : ''">
		<router-outlet/>

	</div>
	@if (showFooter) {
		<app-footer/>
	}
</div>
