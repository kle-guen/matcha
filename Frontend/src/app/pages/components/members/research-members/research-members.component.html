<mat-drawer-container class="h-full">
	<mat-drawer #drawer style="height: 100vh" class="mobile:w-full" mode="over">
		<mat-icon class="cursor-pointer absolute right-2 top-2" (click)="drawer.toggle()">close</mat-icon>
		<div class="p-8 flex flex-col justify-center items-center w-full gap-4 mt-5">
			<div class="flex justify-between items-center w-full">
				<mat-label>Age:</mat-label>
				<mat-slider min="18" max="99" discrete color="primary">
					<input
							[value]="researchFormGroup.controls.ageMin.value"
							[formControl]="researchFormGroup.controls.ageMin"
							matSliderStartThumb
					>
					<input
							[value]="researchFormGroup.controls.ageMax.value"
							[formControl]="researchFormGroup.controls.ageMax"
							matSliderEndThumb
					>
				</mat-slider>
			</div>
			<div class="flex justify-between items-center  w-full">
				<mat-label>Fame rating:</mat-label>
				<mat-slider min="0" max="10" discrete>
					<input
							[value]="researchFormGroup.controls.fameRatingMin.value"
							[formControl]="researchFormGroup.controls.fameRatingMin"
							matSliderThumb
					>
				</mat-slider>
			</div>
			<div class="flex justify-between items-center  w-full">
				<mat-label>Distance:</mat-label>
				<mat-slider min="1" max="1000" discrete>
					<input
							[value]="researchFormGroup.controls.distanceMax.value"
							[formControl]="researchFormGroup.controls.distanceMax"
							matSliderThumb
					>
				</mat-slider>
			</div>
			<app-form-field
					class="w-full"
					[label]="'Interests'"
					[control]="researchFormGroup.controls.interests"
					[options]="interests"
					[multipleSelection]="true"
			/>
			<div class="flex justify-between w-full">
				<app-button
						label="Reset filters"
						type="secondary"
						(clicked)="reset()"
				/>
				<app-button
						label="Search"
						(clicked)="submit()"
				/>
			</div>
		</div>

	</mat-drawer>
	<div class="page-wrapper pb-4">
		<h1 class="text-center pt-4">Research members</h1>
		<div class="my-4 flex">
			<app-button
					label="Search"
					[disabled]="researchFormGroup.invalid"
					(clicked)="drawer.toggle()"
					icon="tune"
					type="tertiary"
			/>
			<mat-chip-listbox>
				<mat-chip-option (click)="sortList(SortResearchMembersEnum.AGE)"
								 [selected]="sortBy === SortResearchMembersEnum.AGE">Age
				</mat-chip-option>
				<mat-chip-option (click)="sortList(SortResearchMembersEnum.DISTANCE)"
								 [selected]="sortBy === SortResearchMembersEnum.DISTANCE">Distance
				</mat-chip-option>
				<mat-chip-option (click)="sortList(SortResearchMembersEnum.FAME_RATING)"
								 [selected]="sortBy === SortResearchMembersEnum.FAME_RATING">Fame rating
				</mat-chip-option>
				<mat-chip-option (click)="sortList(SortResearchMembersEnum.COMMON_INTERESTS)"
								 [selected]="sortBy === SortResearchMembersEnum.COMMON_INTERESTS">Common tags
				</mat-chip-option>
			</mat-chip-listbox>
		</div>
		<div class="grid grid-cols-1 tablet:grid-cols-2 desktop:grid-cols-3 gap-4">
			@for (user of members; track user.id) {
				<app-member-card [member]="user"/>
			}
		</div>
		<div class="flex justify-between mt-4">
			<app-button label="< Previous" type="secondary" [disabled]="page <= 1" (clicked)="previousPage()"/>
			<app-button label="Next >" type="secondary" [disabled]="page >= nbPages" (clicked)="nextPage()"/>
		</div>
	</div>
	<app-footer/>

</mat-drawer-container>
