<div class="page-wrapper py-4">
	<h1 class="text-center pb-2">History</h1>
	@for (hist of history; track hist.user) {
		<div class="py-2">

			@if (hist.type === TypeHistoryEnum.LIKE) {
				<mat-card appearance="outlined">
					<div class="flex items-center justify-between p-2">
						<div class="flex">
							<mat-icon class="text-red-600">favorite</mat-icon>
							<div class="pl-2">Liked by {{ hist.user }}</div>
						</div>
						<div class="text-[10px] text-gray-500">
							{{ hist.date | date: 'dd/MM/yyyy HH:mm' }}
						</div>
					</div>
				</mat-card>
			} @else {
				<mat-card appearance="outlined">
					<div class="flex items-center justify-between p-2">
						<div class="flex">
							<mat-icon class="text-blue-600">visibility</mat-icon>
							<div class="pl-2">Viewed by {{ hist.user }}</div>
						</div>
						<div class="text-[10px] text-gray-500">
							{{ hist.date | date: 'dd/MM/yyyy HH:mm' }}
						</div>
					</div>
				</mat-card>
			}
		</div>
	}
</div>
